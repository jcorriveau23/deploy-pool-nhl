name: slapshot

# Production stack. Every application image is pulled from GHCR, never built
# here: the three application repos build and push on release, this file only
# says which tag runs and how the services find each other.
#
# Unlike the per-repo development compose files, mongo and redis publish no
# ports. They are reachable only over the compose network, which matters on a
# public VPS where a published 27017 is an open database.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and OCSP staples. Losing this volume means re-issuing from
      # Let's Encrypt, which is rate-limited — keep it across redeploys.
      - caddy-data:/data
      - caddy-config:/config
      # Read side of the injury file the scraper writes. See the Caddyfile.
      - injury-data:/srv/injury:ro
    depends_on:
      - frontend
      - backend

  frontend:
    image: ghcr.io/jcorriveau23/new-frontend-pool-nhl:latest
    restart: unless-stopped
    # API_URL is the base that src/lib/server-api.ts appends /api-rust to, so
    # it points at the backend service itself, not at Caddy.
    environment:
      API_URL: http://backend:8000
    expose:
      - "3000"
    depends_on:
      - backend

  backend:
    image: ghcr.io/jcorriveau23/backend-pool-nhl:latest
    restart: unless-stopped
    # Every setting the backend reads is here. The image bakes in no config and
    # this repo no longer mounts a config directory, so this block is the whole
    # picture — and there is no second copy of release.json here to drift
    # against the one in backend-pool-nhl, which keeps localhost defaults
    # because those are correct for `cargo run --release` on a dev machine.
    #
    # Needs a backend image built after the file source was made optional in
    # settings.rs. Older images abort at startup with
    #   Could not parse settings: configuration file "config/release" not found
    # so release the backend before applying this file to a running host.
    #
    # Nested keys separate on __, so APP_SERVER__PORT sets server.port.
    environment:
      APP_ENVIRONMENT: production
      APP_SERVER__PORT: "8000"
      APP_DATABASE__URI: mongodb://mongo:27017
      APP_DATABASE__NAME: hockeypool
      APP_REDIS__URI: redis://redis:6379
      APP_AUTH__JWKS_URL: https://dd4e9e43-679b-4aff-b8de-9e8fd4bd7f30.hanko.io/.well-known/jwks.json
      APP_AUTH__TOKEN_AUDIENCE: slapshot.xyz
      APP_LOGGER__LEVEL: info
      # Prometheus scrape port. Its own listener, so /metrics cannot be reached
      # through /api-rust/* — the only prefix Caddy proxies. Never publish it.
      APP_SERVER__METRICS_PORT: "9000"
    expose:
      - "8000"
      - "9000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  scraper:
    image: ghcr.io/jcorriveau23/script-pool-nhl:latest
    restart: unless-stopped
    # Held out of the default `up` until the image publishes an arm64 variant.
    # On the Ampere host the amd64-only image cannot exec, and `restart:
    # unless-stopped` turns that into a crash loop that the rest of the stack
    # comes up around — a site that looks healthy while nothing refreshes.
    #
    # Start it once that is fixed:
    #   docker compose --profile scrapers up -d
    # Naming the service explicitly also works, which is what keeps the deploy
    # workflow in script-pool-nhl functioning unchanged:
    #   docker compose up -d scraper
    profiles: ["scrapers"]
    # The long-running daemon: daily leaders every 3 minutes, injuries hourly.
    # The one-shot jobs are run by hand and start regardless of the profile:
    #   docker compose run --rm scraper nhl-cumulate-stats
    command: ["nhl-scheduler"]
    environment:
      NHL_HELPER_MONGO_URI: mongodb://mongo:27017
      NHL_HELPER_MONGO_DATABASE: hockeypool
      # The daily-leaders job reads the NHL API through the frontend's
      # /api/games/[date] route handler, so it depends on the frontend being up.
      NHL_HELPER_NHL_PROXY_URL: http://frontend:3000/api
      NHL_HELPER_POOL_API_URL: http://backend:8000/api-rust
      # Written into the shared volume rather than the frontend's public/, which
      # is baked into the frontend image at build time and not writable from here.
      NHL_HELPER_INJURED_PLAYERS_OUTPUT: /data/injured-players.json
      NHL_HELPER_NON_MATCHING_PLAYERS_OUTPUT: /data/non-matching-players-cbs.json
    volumes:
      - injury-data:/data
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_started
      frontend:
        condition: service_started

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      # No initdb.d script. Indexes are created by the backend on every start
      # (init_indexes in pool_service, players_service and daily_leaders_service),
      # which is the only mechanism that survives a restore: mongorestore --drop
      # drops each collection and its indexes, and an initdb.d script has long
      # since run by then — it only ever fires on the first init of an empty
      # volume. Restarting the backend after a restore rebuilds them.

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    # 8-alpine: the draft rooms rely on hash field TTLs (HEXPIRE), redis >= 7.4.
    image: redis:8-alpine
    restart: unless-stopped
    # Draft-room state is short-lived, but a snapshot every 60s means a restart
    # mid-draft does not drop the room.
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Monitoring. Held behind the `monitoring` profile so `docker compose up -d`
  # keeps starting only the site — bring it up with
  #   docker compose --profile monitoring up -d
  # Nothing here is published to the internet: prometheus and the two exporters
  # are compose-network only, and grafana binds to the host's loopback so it is
  # reached over an SSH tunnel rather than a public route. See the README.
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 days is more than enough to compare this draft against the last one,
      # and the size cap is the real guard — whichever trips first wins, so the
      # volume cannot quietly fill the boot disk.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      # --web.enable-lifecycle is deliberately not passed: it defaults to off,
      # and passing it as =false is rejected by the flag parser outright
      # ("unexpected false"), which crash-loops the container.
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    profiles: ["monitoring"]
    # Loopback only. Docker publishes to the container's interface, not the
    # host's, so binding 127.0.0.1 here is what keeps grafana off the public
    # internet even though the port is published — reach it with
    #   ssh -N -L 3001:127.0.0.1:3001 user@server
    # then open http://localhost:3001. Grafana has a steady stream of CVEs and
    # this stack has no reason to give it a public route.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env on the host (gitignored).
      #
      # The default is a placeholder, not a fallback, and the `:-` form is
      # deliberate: compose interpolates this file in full on *every* command
      # regardless of profiles, so a `:?` required-variable here fails
      # `docker compose up -d backend` too — which is what the deploy workflows
      # in the application repos run. A missing .env would have broken every
      # release, not just monitoring.
      #
      # The placeholder is non-empty on purpose. Grafana treats an empty
      # GF_SECURITY_ADMIN_PASSWORD as unset and falls back to admin/admin;
      # this way a forgotten .env yields an unusable password instead of a
      # well-known one.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-unset-see-README-monitoring}
      # Nothing to sign up for on a single-operator install.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Phones home for plugin/version checks otherwise.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Per-container CPU, memory and network, read from the Docker API.
  #
  # Replaces cAdvisor, which is incompatible with this host's containerd
  # snapshotter — see the header of monitoring/telegraf.conf for the full
  # reason and what was tried.
  telegraf:
    image: telegraf:1.33-alpine
    restart: unless-stopped
    profiles: ["monitoring"]
    # Runs as the unprivileged `telegraf` user *on purpose*. The image's
    # entrypoint drops root to that user via su-exec, and su-exec discards
    # supplementary groups — so `user: root` plus `group_add` silently loses the
    # docker group and every API call fails with "permission denied". Starting
    # as non-root skips that branch entirely and keeps group_add intact.
    user: telegraf
    group_add:
      # The host's docker group. Differs per machine, so it comes from .env:
      #   echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" >> .env
      # 999 is the usual value on Debian/Ubuntu. `:-` not `:?` so a missing
      # .env cannot break unrelated compose commands.
      - "${DOCKER_GID:-999}"
    volumes:
      # Not :ro — connecting to a unix socket needs write permission on it.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    expose:
      - "9273"

  # Host CPU, load, memory, disk and network. Reads the host's procfs/sysfs
  # through the mounts rather than joining the host network namespace, so it
  # still resolves on the compose network for prometheus to scrape.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Without this every container's overlay mount shows up as a filesystem.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    expose:
      - "9100"

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
  injury-data:
  prometheus-data:
  grafana-data:
