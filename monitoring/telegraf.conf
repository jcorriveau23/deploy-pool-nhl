# Per-container CPU, memory and network, read from the Docker API.
#
# This replaces cAdvisor, which cannot work on this host: the daemon uses the
# containerd snapshotter (`Storage Driver: overlayfs`), so the
# /var/lib/docker/image/*/layerdb tree cAdvisor needs to identify a container's
# read-write layer does not exist. Its Docker handler fails for every container
# and it reports only the root cgroup. Pointing it at containerd instead does
# collect, but Docker's compose labels are not visible in the moby namespace —
# containers come through keyed by raw container ID, which changes on every
# recreate, so there is nothing stable to group by.
#
# The Docker API has no such problem: it is what `docker stats` uses, and it is
# storage-driver agnostic.

[agent]
  # Matches the prometheus scrape interval; no point sampling faster than it is
  # read.
  interval = "15s"
  flush_interval = "15s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  # Aggregate per container rather than per block device / per network
  # interface. Without "network" here there are no net_rx/net_tx metrics at all.
  total_include = ["cpu", "blkio", "network"]
  # Only these two labels become metric labels. Compose sets a dozen more
  # (config hashes, working dir, the full command) that would be noise.
  docker_label_include = ["com.docker.compose.service", "com.docker.compose.project"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
  # Tags that change on every daemon restart or image bump and would each mint a
  # new series. `container_id` is deliberately not listed: telegraf special-cases
  # it and neither tagexclude nor taginclude removes it. It is left alone because
  # every dashboard query aggregates with `sum by (com_docker_compose_service)`,
  # so a recreated container merges into the same line; the cost is some series
  # churn that ages out with retention.
  tagexclude = ["container_version", "server_version", "engine_host"]
